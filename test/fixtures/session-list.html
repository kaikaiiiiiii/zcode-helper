<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>session list</title>
<style>
  html, body { margin: 0; padding: 0; width: 1200px; font: 14px/1.4 -apple-system, "Segoe UI", sans-serif; }
  [contenteditable="true"], [contenteditable=""], textarea { display: block; min-height: 64px; width: 640px; border: 1px solid #ccc; padding: 6px; }
  button { display: inline-flex; align-items: center; height: 28px; padding: 0 8px; }
  [role="option"] { display: block; height: 32px; }
  li { display: block; height: 32px; }
  ul { margin: 0; padding: 0; list-style: none; }
</style></head>
<body><aside><ul><li data-testid="task-item-sess_idle_0001" data-task-item-key="D:\Coding\demo:sess_idle_0001" draggable="true" tabindex="0"
  class="group/task-item flex cursor-pointer gap-2 rounded-lg pl-2.5 pr-1 py-1 transition" data-state="closed">
  <div class="relative flex size-4 shrink-0 items-center justify-center"><span aria-hidden="true" class="flex size-4 items-center justify-center transition-opacity"></span></div>
  <span class="min-w-0 flex-1 truncate text-ui-base">空闲会话标题</span>
  <span class="text-ui-caption text-foreground-subtle">刚刚</span>
</li>
<li data-testid="task-item-sess_working_0002" data-task-item-key="D:\Coding\demo:sess_working_0002" draggable="true" tabindex="0"
  class="group/task-item flex cursor-pointer gap-2 rounded-lg pl-2.5 pr-1 py-1 transition" data-state="closed">
  <div class="relative flex size-4 shrink-0 items-center justify-center"><span aria-hidden="true" class="flex size-4 items-center justify-center transition-opacity animate-spin"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-loader-circle size-4 text-foreground-subtle" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></span></div>
  <span class="min-w-0 flex-1 truncate text-ui-base">工作中的会话标题</span>
  <span class="text-ui-caption text-foreground-subtle">刚刚</span>
</li>
<li data-testid="task-item-sess_unread_0003" data-task-item-key="D:\Coding\demo:sess_unread_0003" draggable="true" tabindex="0"
  class="group/task-item flex cursor-pointer gap-2 rounded-lg pl-2.5 pr-1 py-1 transition" data-state="closed">
  <div class="relative flex size-4 shrink-0 items-center justify-center"><span aria-hidden="true" class="flex size-4 items-center justify-center transition-opacity"><span data-unread-indicator="true" class="size-[7px] rounded-full bg-icon-blue"></span></span></div>
  <span class="min-w-0 flex-1 truncate text-ui-base">有未读结果的会话标题</span>
  <span class="text-ui-caption text-foreground-subtle">刚刚</span>
</li>
<li data-testid="task-item-sess_error_0004" data-task-item-key="D:\Coding\demo:sess_error_0004" draggable="true" tabindex="0"
  class="group/task-item flex cursor-pointer gap-2 rounded-lg pl-2.5 pr-1 py-1 transition" data-state="closed">
  <div class="relative flex size-4 shrink-0 items-center justify-center"><span aria-hidden="true" class="flex size-4 items-center justify-center transition-opacity"><span data-error-indicator="true" class="h-1.5 w-1.5 rounded-full bg-destructive"></span></span></div>
  <span class="min-w-0 flex-1 truncate text-ui-base">出错中断的会话标题</span>
  <span class="text-ui-caption text-foreground-subtle">刚刚</span>
</li></ul></aside></body></html>
